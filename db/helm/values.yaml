app:
  name: postgres
  namespace: databases
  tier: database
  context: microservices
  port: 5432
  nodeHostname: worker2
  image: 
    name: postgres:17.5
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 2048Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m
service:
  portName: postgres-port
  protocol: TCP
  port: 5432
  nodePort: 5432
